name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, conventions, Drizzle generation and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Première génération contrôlée du lockfile. Une fois le lockfile commité,
      # cette étape repasse à bun install --frozen-lockfile.
      - name: Install dependencies and write Bun lockfile
        run: bun install

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Project conventions
        run: bun run check

      - name: Generate initial Drizzle migration (schema-only, no database connection)
        run: bun run db:generate -- --name=initial_schema
        env:
          DATABASE_MIGRATION_URL: postgresql://ci:ci@127.0.0.1:5432/schema_only

      - name: Upload generated lockfile and SQL migration
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-bootstrap
          if-no-files-found: error
          path: |
            bun.lock
            db/migrations/**

      - name: Verify the generated lockfile is reproducible
        run: bun install --frozen-lockfile

      - name: Commit generated lockfile and initial migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/postgres-drizzle-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock db/migrations
          if git diff --cached --quiet; then
            echo "Lockfile and Drizzle migration are already committed."
            exit 0
          fi
          git commit -m "chore(db): add Bun lockfile and initial Drizzle migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Production build
        run: bun run build
        env:
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
          VIEW_HASH_SALT: ci-only-view-salt-with-at-least-32-bytes
