name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, conventions, Drizzle checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Project conventions
        run: bun run check

      - name: Check Drizzle migration journal (no database connection)
        run: bun run db:check
        env:
          DATABASE_MIGRATION_URL: postgresql://ci:ci@127.0.0.1:5432/schema_only

      - name: Production build
        run: bun run build
        env:
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
          VIEW_HASH_SALT: ci-only-view-salt-with-at-least-32-bytes
